name: Retag image

# 把已有镜像重打一个标签（不重新构建）。
# - 手动触发：可在 Actions 页面填 src/dst
# - 推送 .retag 文件触发：内容为 "源标签 目标标签"（供无法调用 API 的场景使用）
on:
  workflow_dispatch:
    inputs:
      src:
        description: 源标签（如 latest）
        required: true
        default: latest
      dst:
        description: 目标标签（如 1.0.7-community.3）
        required: true
  push:
    paths:
      - .retag

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          if [ -n "${{ inputs.dst }}" ]; then
            echo "src=${{ inputs.src }}" >> "$GITHUB_OUTPUT"
            echo "dst=${{ inputs.dst }}" >> "$GITHUB_OUTPUT"
          else
            read -r SRC DST < .retag
            echo "src=$SRC" >> "$GITHUB_OUTPUT"
            echo "dst=$DST" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/flymail
          docker pull "$IMG:${{ steps.tags.outputs.src }}"
          docker tag "$IMG:${{ steps.tags.outputs.src }}" "$IMG:${{ steps.tags.outputs.dst }}"
          docker push "$IMG:${{ steps.tags.outputs.dst }}"
