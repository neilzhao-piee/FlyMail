name: Retag image

# 手动把已有镜像重打一个标签（不重新构建），用于补发/修正版本标签
on:
  workflow_dispatch:
    inputs:
      src:
        description: 源标签（如 latest）
        required: true
        default: latest
      dst:
        description: 目标标签（如 1.0.7-community.3）
        required: true

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/flymail
          docker pull "$IMG:${{ inputs.src }}"
          docker tag "$IMG:${{ inputs.src }}" "$IMG:${{ inputs.dst }}"
          docker push "$IMG:${{ inputs.dst }}"
